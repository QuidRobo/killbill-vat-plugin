# ---------------------------------------------------------------------------
# killbill-vat: UK plus EU B2C under the One Stop Shop.
#
# ==> THIS FILE IS A CHECKLIST, NOT A READY CONFIGURATION. <==
#
# Every EU rate below is deliberately set to TODO, which the plugin cannot parse.
# Upload it as it stands and GET /plugins/killbill-vat/config will list every
# country you have not filled in yet. Work down that list until it is empty.
#
# The rates are not shipped pre-filled on purpose. EU standard rates change on
# legislative timelines, several moved in the last two years, and a plausible but
# stale rate is worse than a missing one: a missing rate is reported, a wrong rate
# silently under-collects until someone notices. Fill these from the European
# Commission's published "VAT rates applied in the Member States" table and record
# the date you did it.
#
# Rates verified on: __________  by: __________
#
# Also: do not set ossRegistered = true until the Non-Union OSS registration
# actually exists. Charging a rate you cannot remit is worse than not charging it.
# ---------------------------------------------------------------------------

org.killbill.billing.plugin.vat.enabled = true
org.killbill.billing.plugin.vat.supplierCountry = GB
org.killbill.billing.plugin.vat.priceMode = EXCLUSIVE
org.killbill.billing.plugin.vat.rounding.scale = 2
org.killbill.billing.plugin.vat.rounding.mode = HALF_UP

# UK standard rate, in force since 4 January 2011.
org.killbill.billing.plugin.vat.rates.GB.standard.0.rate = 0.20
org.killbill.billing.plugin.vat.rates.GB.standard.0.from = 2011-01-04

org.killbill.billing.plugin.vat.euB2cTreatment = DESTINATION
org.killbill.billing.plugin.vat.ossRegistered = false
org.killbill.billing.plugin.vat.euB2cUnregisteredTreatment = DOMESTIC
org.killbill.billing.plugin.vat.unknownCountryTreatment = DOMESTIC

org.killbill.billing.plugin.vat.vatNumberValidation = EXTERNAL
org.killbill.billing.plugin.vat.vatNumberValidation.maxAgeDays = 90

org.killbill.billing.plugin.vat.taxItemDescription = VAT {rate}
org.killbill.billing.plugin.vat.legend.reverseCharge = Reverse charge: VAT to be accounted for by the recipient.
org.killbill.billing.plugin.vat.legend.outsideScope = Outside the scope of UK VAT: place of supply is outside the United Kingdom.

