# ---------------------------------------------------------------------------
# killbill-vat-plugin: example tenant configuration
#
# Upload with:
#   POST /1.0/kb/tenants/uploadPluginConfig/killbill-vat
#   Content-Type: text/plain
#
# Kill Bill fires TENANT_CONFIG_CHANGE on upload, so changes take effect
# without a restart.
# ---------------------------------------------------------------------------

# Where the supplier is established. Drives what counts as a domestic supply.
org.killbill.billing.plugin.vat.supplierCountry = GB

# --- price mode ------------------------------------------------------------
# EXCLUSIVE: catalogue prices are net, VAT is added, the total goes up.
# INCLUSIVE: catalogue prices already contain VAT, the charge line is reduced
#            to net and the total is unchanged.
org.killbill.billing.plugin.vat.priceMode = EXCLUSIVE

# Per-plan and per-product overrides. Plan wins over product wins over the
# tenant default, so consumer plans can be inclusive while business plans are
# exclusive in the same catalogue.
#org.killbill.billing.plugin.vat.priceMode.plans.consumer-monthly    = INCLUSIVE
#org.killbill.billing.plugin.vat.priceMode.products.ConsumerBundle   = INCLUSIVE

# --- rounding --------------------------------------------------------------
org.killbill.billing.plugin.vat.rounding.scale = 2
org.killbill.billing.plugin.vat.rounding.mode  = HALF_UP

# --- rates -----------------------------------------------------------------
# Shorthand form, always in force. A fraction (0.20) or a percentage (20%).
# A bare "20" is rejected: it is ambiguous between 20% and 2000%.
org.killbill.billing.plugin.vat.rates.GB.standard = 0.20

# Dated form, for rate history. Half-open: "from" is included, "to" is not.
# A credit against an old supply must reverse VAT at the rate that applied then.
#org.killbill.billing.plugin.vat.rates.GB.standard.0.rate = 0.175
#org.killbill.billing.plugin.vat.rates.GB.standard.0.from = 2008-12-01
#org.killbill.billing.plugin.vat.rates.GB.standard.0.to   = 2010-01-01
#org.killbill.billing.plugin.vat.rates.GB.standard.1.rate = 0.20
#org.killbill.billing.plugin.vat.rates.GB.standard.1.from = 2011-01-04

# EU standard rates. Required only if you charge EU B2C under OSS.
# Verify these against the current EU VAT rates table before relying on them.
#org.killbill.billing.plugin.vat.rates.AT.standard = 0.20
#org.killbill.billing.plugin.vat.rates.BE.standard = 0.21
#org.killbill.billing.plugin.vat.rates.DE.standard = 0.19
#org.killbill.billing.plugin.vat.rates.ES.standard = 0.21
#org.killbill.billing.plugin.vat.rates.FR.standard = 0.20
#org.killbill.billing.plugin.vat.rates.IE.standard = 0.23
#org.killbill.billing.plugin.vat.rates.IT.standard = 0.22
#org.killbill.billing.plugin.vat.rates.NL.standard = 0.21

# --- treatment -------------------------------------------------------------
# Countries where a B2B supply is a reverse charge rather than outside scope.
# Defaults to the EU list. An EU-established supplier should add GB.
#org.killbill.billing.plugin.vat.reverseChargeCountries = AT,BE,...,SE

# What to do with an EU consumer. DESTINATION charges their own country rate.
org.killbill.billing.plugin.vat.euB2cTreatment = DESTINATION

# Whether the supplier actually holds an EU One Stop Shop registration.
#
# This is deliberately separate from having EU rates configured. A rate says what Germany
# charges; it says nothing about whether you may collect and remit it. With this false, an EU
# B2C supply falls back to euB2cUnregisteredTreatment and logs a warning, rather than
# collecting German VAT you have no mechanism to hand over.
org.killbill.billing.plugin.vat.ossRegistered = false
org.killbill.billing.plugin.vat.euB2cUnregisteredTreatment = DOMESTIC

# What to do when the account has no country. DOMESTIC charges supplier VAT,
# which over-collects rather than under-collects. Change deliberately.
org.killbill.billing.plugin.vat.unknownCountryTreatment = DOMESTIC

# Countries outside the EU where the supplier holds a registration. Until a
# country appears here, supplies there are outside scope.
#org.killbill.billing.plugin.vat.registeredCountries = NO,CH,AU

# --- VAT number validation -------------------------------------------------
# CHECKSUM: structure and check digits only. Offline, and not proof of
#           registration. Fine for development.
# EXTERNAL: requires a recent successful check recorded on the account as
#           customerVatNumberValidatedAt. Use this in production.
# NONE:     trust whatever is on file. Development only.
org.killbill.billing.plugin.vat.vatNumberValidation = CHECKSUM
org.killbill.billing.plugin.vat.vatNumberValidation.maxAgeDays = 90

# --- presentation ----------------------------------------------------------
# {rate} and {country} are substituted.
org.killbill.billing.plugin.vat.taxItemDescription = VAT {rate}

org.killbill.billing.plugin.vat.legend.reverseCharge = Reverse charge: VAT to be accounted for by the recipient.
org.killbill.billing.plugin.vat.legend.outsideScope  = Outside the scope of UK VAT: place of supply is outside the United Kingdom.

# --- extension -------------------------------------------------------------
# Your own rules. Needs a public no-argument constructor.
#org.killbill.billing.plugin.vat.treatmentResolver = com.example.MyVatResolver

# Master switch.
org.killbill.billing.plugin.vat.enabled = true
